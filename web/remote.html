<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02060d">
<title>Nova Remote</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%2302060d' stroke='%2337d6ff' stroke-width='6'/%3E%3Ccircle cx='50' cy='50' r='20' fill='%2337d6ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="remote.css">
</head>
<body>
<header>
  <div class="brand">NOVA<span>REMOTE</span></div>
  <button id="btnMode" type="button" class="mode-btn">Cyber Mode</button>
  <div id="conn"><i></i><span id="connText">Connecting…</span></div>
</header>
<div id="unencryptedWarning" style="background:rgba(255,170,0,0.12);border:1px solid #ffaa00;color:#ffaa00;padding:6px 10px;border-radius:4px;margin:8px;font-size:11px;line-height:1.3;text-align:center;">
  ⚠️ Notice: Unencrypted HTTP connection on LAN. Use on trusted private Wi-Fi networks only.
</div>

<main id="log" aria-live="polite"></main>

<div id="chips"></div>

<form id="form" autocomplete="off">
  <button type="button" id="mic" title="Speak" aria-label="Speak">🎤</button>
  <input id="text" placeholder="Tell Nova what to do on your PC…" enterkeyhint="send">
  <button id="send" aria-label="Send">➤</button>
</form>
<label id="speakrow"><input type="checkbox" id="speakToggle" checked> Nova speaks replies on this phone</label>

<script src="remote.js"></script>
</body>
</html>
